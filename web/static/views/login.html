<div class="auth" x-data="loginView">
  <div class="auth-form">
    <form class="inner in1" @submit.prevent="submit">
      <a class="marca" href="#/" style="padding:0"><span class="logo"></span><span class="word">DENTAL HOME</span></a>
      <div><h1>Bienvenido de vuelta</h1><p class="muted" style="margin-top:8px">Entra a tu consultorio.</p></div>
      <div class="field"><label for="c">Código de la clínica</label><input id="c" class="input" x-model="f.clinica" placeholder="mi-consultorio" autocomplete="organization" autocapitalize="off" required></div>
      <div class="field"><label for="u">Usuario o correo</label><input id="u" class="input" x-model="f.usuario" autocomplete="username" autocapitalize="off" required></div>
      <div class="field"><label for="p" style="display:flex;justify-content:space-between">Contraseña <a class="link" style="font-size:12.5px" href="#/olvide">¿La olvidaste?</a></label><input id="p" type="password" class="input" x-model="f.password" autocomplete="current-password" required></div>
      <div class="error-text" x-show="error" x-text="error"></div>
      <button class="btn primary lg" :class="{ 'is-busy': busy }" style="width:100%">Entrar <svg class="i arr"><use href="#i-arrow"/></svg></button>
      <p class="muted" style="text-align:center">¿Aún no tienes cuenta? <a class="link" href="#/registro">Prueba 14 días gratis</a></p>
    </form>
  </div>
  <div class="auth-art">
    <svg class="spark" style="width:22px;top:18%;left:16%" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></svg>
    <svg class="spark" style="width:14px;bottom:22%;right:18%;animation-delay:-1.2s" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></svg>
    <div><div class="emblem float1"></div>
      <blockquote>“Pasamos del cuaderno a tener la agenda y las historias clínicas en el celular.”<small>Consultorio dental · Puno</small></blockquote></div>
  </div>

</div>
