<div x-data="citasView">
  <div class="page-head">
    <div><div class="kicker">Agenda</div><h1 style="margin-top:8px" x-text="soyDoctor ? 'Mi agenda' : 'Agenda del consultorio'"></h1><p x-text="resumen"></p></div>
    <button class="btn primary" @click="nueva()"><svg class="i"><use href="#i-plus"/></svg>Nueva cita</button>
  </div>

  <div class="toolbar">
    <div class="datenav">
      <button class="btn ghost icon" @click="mover(-1)" aria-label="Anterior"><svg class="i"><use href="#i-left"/></svg></button>
      <h2 x-text="fmt.cap(titulo)"></h2>
      <button class="btn ghost icon" @click="mover(1)" aria-label="Siguiente"><svg class="i"><use href="#i-right"/></svg></button>
    </div>
    <button class="btn sm" @click="hoy()">Hoy</button>
    <div class="grow"></div>
    <select class="input" style="width:auto;height:40px;border-radius:999px" x-show="!soyDoctor" x-model="doctor" @change="cargar()">
      <option value="">Todos los doctores</option>
      <template x-for="d in doctores" :key="d.id"><option :value="d.id" x-text="'Dr(a). ' + d.usuario"></option></template>
    </select>
    <div class="seg"><template x-for="p in ['dia','semana','mes']" :key="p"><button :class="{ on: periodo === p }" @click="periodo = p; cargar()" x-text="fmt.cap(p === 'dia' ? 'día' : p)"></button></template></div>
  </div>

  <template x-if="cargando && !citas.length"><div class="card" style="display:grid;gap:12px"><template x-for="n in 4"><div class="skel" style="height:52px"></div></template></div></template>

  <!-- DÍA -->
  <template x-if="periodo === 'dia' && !(cargando && !citas.length)">
    <div class="card" style="padding:16px">
      <template x-if="!citas.length"><div class="empty"><svg class="art float1" viewBox="0 0 120 100" fill="none"><rect x="18" y="16" width="84" height="70" rx="18" fill="var(--surface-2)"/><path d="M18 38h84M42 10v14M78 10v14" stroke="var(--brand-2)" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="60" r="7" fill="var(--brand)"/></svg>
        <h3>Sin citas este día</h3><p>Un buen momento para ponerse al día.</p><button class="btn primary sm" @click="nueva()">Agendar cita</button></div></template>
      <div class="timeline stagger">
        <template x-for="(c, i) in citas" :key="c.id">
          <div class="tl-item" :class="{ done: c.estado === 'completada', cancel: c.estado === 'cancelada' }" :style="'--i:' + Math.min(i, 12)">
            <span class="t num"><span x-text="c.hora"></span><small x-text="c.horaFin"></small></span>
            <span class="rail"></span>
            <div class="who"><strong x-text="c.paciente"></strong>
              <span><span x-text="'Dr(a). ' + c.doctor + ' · ' + c.minutos + ' min'"></span><span x-show="c.estado === 'cancelada' && c.motivoCancelacion" x-text="' · ' + c.motivoCancelacion"></span></span></div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
              <template x-if="enCurso(c)"><span class="badge brand"><span class="dot-live" style="margin-left:-2px"></span>En curso</span></template>
              <span x-show="!enCurso(c)" class="badge" :class="{ ok: c.estado === 'completada', warn: c.estado === 'pendiente', bad: c.estado === 'cancelada' }" x-text="fmt.estado(c.estado)"></span>
              <a class="btn sm primary" x-show="c.estado !== 'cancelada' && !c.tieneRegistro && c.fecha <= fmt.today() && $store.app.is('doctor','administrador')" :href="'#/historial/' + c.pacienteId + '?cita=' + c.id">Atender</a>
              <template x-if="c.estado === 'pendiente'"><span style="display:flex;gap:2px">
                <button class="btn ghost icon sm" title="Marcar atendida" @click="completar(c)"><svg class="i"><use href="#i-check"/></svg></button>
                <button class="btn ghost icon sm" title="Reprogramar" @click="reprogramar(c)"><svg class="i"><use href="#i-clock"/></svg></button>
                <button class="btn ghost icon sm danger" title="Cancelar" @click="cancelar(c)"><svg class="i"><use href="#i-x"/></svg></button>
              </span></template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- SEMANA -->
  <template x-if="periodo === 'semana'">
    <div class="week stagger">
      <template x-for="(d, i) in diasSemana" :key="d">
        <div class="day-col" :class="{ today: d === fmt.today() }" :style="'--i:' + i">
          <header @click="irDia(d)"><span x-text="fmt.DIAS[fmt.parse(d).getDay()].slice(0, 3)"></span><b x-text="fmt.parse(d).getDate()"></b></header>
          <template x-for="c in porDia(d)" :key="c.id"><div class="chip-cita" :class="c.estado" @click="irDia(d)"><b class="num" x-text="c.hora"></b><span x-text="c.paciente"></span></div></template>
          <span class="hint" x-show="!porDia(d).length">—</span>
        </div>
      </template>
    </div>
  </template>

  <!-- MES -->
  <template x-if="periodo === 'mes'">
    <div class="month">
      <template x-for="n in ['lun','mar','mié','jue','vie','sáb','dom']"><div class="dow" x-text="n"></div></template>
      <template x-for="c in celdasMes" :key="c.f">
        <button class="mcell" :class="{ off: !c.dentro, today: c.f === fmt.today() }" @click="irDia(c.f)">
          <b class="num" x-text="fmt.parse(c.f).getDate()"></b>
          <i x-show="porDia(c.f).length" x-text="porDia(c.f).length + (porDia(c.f).length === 1 ? ' cita' : ' citas')"></i>
        </button>
      </template>
    </div>
  </template>

  <!-- Modal: nueva cita -->
  <template x-if="form">
    <div class="overlay" @click.self="form = null" @keydown.escape.window="form = null">
      <form class="modal wide" @submit.prevent="guardar">
        <div class="kicker">Nueva cita</div><h2 style="margin-top:6px">Agendar</h2><p class="sub">Elige paciente, doctor, duración y un horario libre.</p>
        <div class="form">
          <div class="field"><label>Paciente</label>
            <template x-if="form.paciente"><div class="card soft" style="padding:10px 14px;display:flex;align-items:center;gap:12px"><div class="avatar sm" x-text="fmt.initials(form.paciente.nombreCompleto)"></div><div style="flex:1"><b x-text="form.paciente.nombreCompleto"></b><div class="muted" style="font-size:13px" x-text="form.paciente.tipoDocumento + ' ' + form.paciente.numeroDocumento"></div></div><button type="button" class="btn ghost sm" @click="form.paciente = null; form.q = ''">Cambiar</button></div></template>
            <template x-if="!form.paciente"><div><input class="input" placeholder="Buscar por nombre o documento" x-model="form.q" @input.debounce.200ms="buscarPaciente()" x-init="$nextTick(() => $el.focus())">
              <div class="picker" x-show="form.res.length"><template x-for="p in form.res" :key="p.id"><button type="button" @click="form.paciente = p"><div class="avatar sm" x-text="fmt.initials(p.nombreCompleto)"></div><span x-text="p.nombreCompleto"></span><span class="muted num" style="margin-left:auto" x-text="p.numeroDocumento"></span></button></template></div></div></template>
          </div>
          <div class="grid-3">
            <div class="field" x-show="!soyDoctor"><label>Doctor</label>
              <select class="input" x-model="form.doctorId" @change="libres()" :required="!soyDoctor"><option value="">Seleccionar</option><template x-for="d in doctores" :key="d.id"><option :value="d.id" x-text="'Dr(a). ' + d.usuario"></option></template></select></div>
            <div class="field"><label>Fecha</label><input type="date" class="input" x-model="form.fecha" :min="fmt.today()" @change="libres()" required></div>
            <div class="field"><label>Duración</label><select class="input" x-model="form.minutos" @change="libres()"><template x-for="m in DURACIONES" :key="m"><option :value="m" :selected="m == form.minutos" x-text="m + ' min'"></option></template></select></div>
          </div>
          <div class="field"><label>Horario</label>
            <div class="slots"><template x-for="h in HORAS" :key="h"><button type="button" class="slot num" :class="{ on: form.hora === h }" :disabled="!libre(h, form.fecha, form.minutos)" @click="form.hora = h" x-text="h"></button></template></div>
            <span class="hint" x-show="!form.doctorId && !soyDoctor">Elige un doctor para ver su disponibilidad.</span>
            <span class="hint" x-show="form.hora" x-text="'De ' + form.hora + ' a ' + fmt.hhmm(fmt.min(form.hora) + Number(form.minutos))"></span>
          </div>
          <div class="error-text" x-show="error" x-text="error"></div>
          <div class="actions"><button type="button" class="btn" @click="form = null">Cancelar</button><button class="btn primary" :class="{ 'is-busy': busy }" :disabled="!form.paciente || !form.hora">Agendar cita</button></div>
        </div>
      </form>
    </div>
  </template>

  <!-- Modal: reprogramar -->
  <template x-if="rep">
    <div class="overlay" @click.self="rep = null" @keydown.escape.window="rep = null">
      <form class="modal wide" @submit.prevent="guardarRep">
        <div class="kicker">Reprogramar</div><h2 style="margin-top:6px" x-text="rep.c.paciente"></h2><p class="sub" x-text="'Dr(a). ' + rep.c.doctor + ' · antes ' + fmt.short(rep.c.fecha) + ' ' + rep.c.hora"></p>
        <div class="form">
          <div class="grid-2">
            <div class="field"><label>Nueva fecha</label><input type="date" class="input" x-model="rep.fecha" :min="fmt.today()" @change="libresRep()" required></div>
            <div class="field"><label>Duración</label><select class="input" x-model="rep.minutos" @change="libresRep()"><template x-for="m in DURACIONES" :key="m"><option :value="m" :selected="m == rep.minutos" x-text="m + ' min'"></option></template></select></div>
          </div>
          <div class="field"><label>Horario</label><div class="slots"><template x-for="h in HORAS" :key="h"><button type="button" class="slot num" :class="{ on: rep.hora === h }" :disabled="!libre(h, rep.fecha, rep.minutos)" @click="rep.hora = h" x-text="h"></button></template></div></div>
          <div class="error-text" x-show="error" x-text="error"></div>
          <div class="actions"><button type="button" class="btn" @click="rep = null">Cancelar</button><button class="btn primary" :class="{ 'is-busy': busy }" :disabled="!rep.hora">Reprogramar</button></div>
        </div>
      </form>
    </div>
  </template>

  <!-- Modal: cancelar -->
  <template x-if="canc">
    <div class="overlay" @click.self="canc = null" @keydown.escape.window="canc = null">
      <form class="modal" @submit.prevent="guardarCanc">
        <div class="kicker">Cancelar cita</div><h2 style="margin-top:6px" x-text="canc.c.paciente"></h2><p class="sub" x-text="fmt.cap(fmt.long(canc.c.fecha)) + ' · ' + canc.c.hora"></p>
        <div class="form">
          <div class="field"><label>Motivo de la cancelación</label><textarea class="input" x-model="canc.motivo" minlength="5" maxlength="300" required placeholder="Mínimo 5 caracteres" x-init="$nextTick(() => $el.focus())"></textarea></div>
          <div class="error-text" x-show="error" x-text="error"></div>
          <div class="actions"><button type="button" class="btn" @click="canc = null">Volver</button><button class="btn danger-fill" :class="{ 'is-busy': busy }">Cancelar cita</button></div>
        </div>
      </form>
    </div>
  </template>
</div>
