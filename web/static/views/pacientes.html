<div x-data="pacientesView">
  <div class="page-head">
    <div><div class="kicker">Padrón</div><h1 style="margin-top:8px">Pacientes</h1><p><span class="num" x-text="lista.length"></span> <span x-text="todos ? 'registros' : 'activos'"></span></p></div>
    <button class="btn primary" @click="nuevo()"><svg class="i"><use href="#i-userplus"/></svg>Nuevo paciente</button>
  </div>

  <div class="toolbar">
    <div style="position:relative;flex:1;min-width:220px;max-width:440px">
      <svg class="i" style="position:absolute;left:16px;top:14px;color:var(--muted)"><use href="#i-search"/></svg>
      <input class="input" style="padding-left:44px;border-radius:999px" placeholder="Buscar por nombre, apellido o documento" x-model="q" @input.debounce.250ms="cargar()">
    </div>
    <label class="check" style="align-items:center"><input type="checkbox" x-model="todos" @change="cargar()">Mostrar dados de baja</label>
  </div>

  <div class="card" style="padding:16px 10px">
    <template x-if="cargando"><div style="padding:12px 14px;display:grid;gap:12px"><template x-for="n in 5"><div class="skel" style="height:46px"></div></template></div></template>
    <template x-if="!cargando && !lista.length">
      <div class="empty"><svg class="art float1" viewBox="0 0 120 100" fill="none"><circle cx="60" cy="50" r="42" fill="var(--surface-2)"/><circle cx="60" cy="40" r="13" fill="var(--brand-2)"/><path d="M34 80c3-14 13-21 26-21s23 7 26 21" fill="var(--brand-deep)"/><path class="spark" d="M98 16c.4 3 1.6 4.8 6 6-4.4 1.2-5.6 3-6 6-.4-3-1.6-4.8-6-6 4.4-1.2 5.6-3 6-6Z" fill="var(--brand)"/></svg>
        <h3 x-text="q ? 'Sin coincidencias' : 'Aún no hay pacientes'"></h3><p x-text="q ? 'Prueba con otro nombre o documento.' : 'Registra a tu primer paciente para empezar.'"></p>
        <button class="btn primary sm" x-show="!q" @click="nuevo()">Registrar paciente</button></div>
    </template>
    <div class="table-wrap" x-show="!cargando && lista.length">
      <table class="table">
        <thead><tr><th>Paciente</th><th class="hide-m">Documento</th><th class="hide-m">Contacto</th><th>Edad</th><th></th></tr></thead>
        <tbody>
          <template x-for="(p, i) in lista" :key="p.id">
            <tr :style="'--i:' + Math.min(i, 14)">
              <td><div class="cell-user"><div class="avatar" :style="p.activo ? '' : 'opacity:.5'" x-text="fmt.initials(p.nombres + ' ' + p.apellidos)"></div>
                <div><strong x-text="p.apellidos + ', ' + p.nombres"></strong><span x-text="p.sexo === 'F' ? 'Femenino' : p.sexo === 'M' ? 'Masculino' : 'Sin dato'"></span> <span class="badge bad plain" x-show="!p.activo" style="height:20px">Baja</span></div></div></td>
              <td class="num hide-m"><span class="muted" style="font-size:12px;font-weight:800" x-text="p.tipoDocumento"></span> <span x-text="p.numeroDocumento"></span></td>
              <td class="hide-m"><div x-text="p.telefono || '—'"></div><div class="muted" style="font-size:12.5px" x-text="p.correo"></div></td>
              <td class="num" x-text="p.edad !== null ? p.edad + ' años' : '—'"></td>
              <td><div class="row-actions">
                <a class="btn ghost icon sm" title="Agendar cita" x-show="p.activo" :href="'#/citas?nueva=1&paciente=' + p.id"><svg class="i"><use href="#i-calendar"/></svg></a>
                <a class="btn ghost icon sm" title="Historial clínico" x-show="$store.app.is('doctor','administrador')" :href="'#/historial/' + p.id"><svg class="i"><use href="#i-file"/></svg></a>
                <button class="btn ghost icon sm" title="Editar" @click="editar(p)"><svg class="i"><use href="#i-edit"/></svg></button>
                <button class="btn ghost icon sm danger" title="Dar de baja" x-show="p.activo && $store.app.is('administrador','secretaria')" @click="baja(p)"><svg class="i"><use href="#i-trash"/></svg></button>
                <button class="btn ghost sm" x-show="!p.activo && $store.app.is('administrador')" @click="reactivar(p)">Reactivar</button>
              </div></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <template x-if="form">
    <div class="overlay right" @click.self="form = null" @keydown.escape.window="form = null">
      <form class="drawer" @submit.prevent="guardar">
        <div class="kicker" x-text="form.id ? 'Editar' : 'Nuevo'"></div>
        <h2 style="margin-top:6px" x-text="form.id ? form.nombres + ' ' + form.apellidos : 'Registrar paciente'"></h2>
        <p class="sub" x-text="form.id ? 'Actualiza sus datos de identidad y contacto.' : 'Se creará también su historial clínico.'"></p>
        <div class="form">
          <div class="grid-2">
            <div class="field"><label>Nombres</label><input class="input" x-model="form.nombres" required maxlength="80" x-init="$nextTick(() => $el.focus())"></div>
            <div class="field"><label>Apellidos</label><input class="input" x-model="form.apellidos" required maxlength="80"></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Documento</label><select class="input" x-model="form.tipoDocumento"><option value="DNI">DNI</option><option value="CE">Carné de extranjería</option><option value="PASAPORTE">Pasaporte</option></select></div>
            <div class="field"><label>Número</label><input class="input num" x-model="form.numeroDocumento" required :inputmode="form.tipoDocumento === 'DNI' ? 'numeric' : 'text'" :pattern="form.tipoDocumento === 'DNI' ? '[0-9]{8}' : '[A-Za-z0-9]{6,12}'" maxlength="12" :placeholder="form.tipoDocumento === 'DNI' ? '8 dígitos' : '6 a 12 caracteres'"></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Fecha de nacimiento</label><input type="date" class="input" x-model="form.fechaNacimiento" :max="fmt.today()"></div>
            <div class="field"><label>Sexo</label><select class="input" x-model="form.sexo"><option value="">Sin especificar</option><option value="F">Femenino</option><option value="M">Masculino</option></select></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Teléfono / WhatsApp</label><input class="input" x-model="form.telefono" inputmode="tel" maxlength="20"></div>
            <div class="field"><label>Correo</label><input type="email" class="input" x-model="form.correo" maxlength="120"></div>
          </div>
          <span class="hint" style="margin-top:-8px">Con teléfono o correo, el paciente recibe un recordatorio 24 h antes de cada cita.</span>
          <div class="field"><label>Dirección</label><input class="input" x-model="form.direccion" maxlength="160"></div>
          <div class="error-text" x-show="error" x-text="error"></div>
          <div class="actions"><button type="button" class="btn" @click="form = null">Cancelar</button><button class="btn primary" :class="{ 'is-busy': busy }" x-text="form.id ? 'Guardar cambios' : 'Registrar paciente'"></button></div>
        </div>
      </form>
    </div>
  </template>
</div>
