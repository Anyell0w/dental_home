<div x-data="inicioView">
  <div class="page-head">
    <div><div class="kicker" x-text="fmt.cap(fmt.long(fmt.today()))"></div><h1 style="margin-top:8px"><span x-text="fmt.saludo()"></span>, <span x-text="$store.app.user.usuario"></span></h1></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="#/pacientes?nuevo=1"><svg class="i"><use href="#i-userplus"/></svg>Paciente</a>
      <a class="btn primary" href="#/citas?nueva=1"><svg class="i"><use href="#i-plus"/></svg>Nueva cita</a>
    </div>
  </div>

  <template x-if="!d">
    <div class="grid-stats"><template x-for="n in 4"><div class="card"><div class="skel" style="height:14px;width:50%"></div><div class="skel" style="height:34px;width:40%;margin-top:14px"></div></div></template></div>
  </template>

  <template x-if="d">
    <div>
      <div class="grid-stats stagger">
        <div class="card stat hover" style="--i:0"><span class="tile deep"><svg class="i"><use href="#i-users"/></svg></span><span class="k">Pacientes activos</span><span class="v num" x-count="d.stats.pacientes_activos">0</span></div>
        <div class="card stat hover" style="--i:1"><span class="tile accent"><svg class="i"><use href="#i-calendar"/></svg></span><span class="k">Citas hoy</span><span class="v num" x-count="d.stats.citas_hoy">0</span></div>
        <div class="card stat hover" style="--i:2"><span class="tile outline"><svg class="i"><use href="#i-check"/></svg></span><span class="k">Atendidas hoy</span><span class="v num" x-count="d.stats.completadas_hoy">0</span></div>
        <div class="card stat hover" style="--i:3"><span class="tile"><svg class="i"><use href="#i-pill"/></svg></span><span class="k">Recetas este mes</span><span class="v num" x-count="d.stats.recetas_mes">0</span></div>
      </div>

      <div class="cols">
        <div class="stack">
          <div class="card">
            <div class="card-head"><div><div class="kicker">Hoy</div><h3 style="margin-top:4px">Agenda del consultorio</h3></div>
              <a class="btn sm" href="#/citas">Ver agenda <svg class="i arr"><use href="#i-arrow"/></svg></a></div>
            <template x-if="!d.agenda.length">
              <div class="empty"><svg class="art float1" viewBox="0 0 120 100" fill="none"><rect x="18" y="16" width="84" height="70" rx="18" fill="var(--surface-2)"/><rect x="30" y="34" width="60" height="10" rx="5" fill="var(--brand-2)"/><rect x="30" y="52" width="40" height="10" rx="5" fill="var(--line-2)"/><path class="spark" d="M96 10c.4 3 1.6 4.8 6 6-4.4 1.2-5.6 3-6 6-.4-3-1.6-4.8-6-6 4.4-1.2 5.6-3 6-6Z" fill="var(--brand)"/></svg>
                <h3>Día libre</h3><p>No hay citas para hoy.</p><a class="btn primary sm" href="#/citas?nueva=1">Agendar una cita</a></div>
            </template>
            <div class="timeline stagger">
              <template x-for="(a, i) in d.agenda" :key="a.id">
                <div class="tl-item" :class="{ done: a.estado === 'completada' }" :style="'--i:' + i">
                  <span class="t num"><span x-text="a.hora"></span><small x-text="a.minutos + ' min'"></small></span>
                  <span class="rail"></span>
                  <div class="who"><strong x-text="a.paciente"></strong><span x-text="'Dr(a). ' + a.doctor"></span></div>
                  <span style="display:flex;align-items:center;gap:8px">
                    <template x-if="enCurso(a)"><span class="badge brand"><span class="dot-live" style="margin-left:-2px"></span>En curso</span></template>
                    <span x-show="!enCurso(a)" class="badge" :class="{ ok: a.estado === 'completada', warn: a.estado === 'pendiente' }" x-text="fmt.estado(a.estado)"></span>
                  </span>
                </div>
              </template>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Últimos 7 días</h3><span class="muted" style="font-size:13px;font-weight:700" x-text="d.semana.reduce((s, x) => s + x.citas, 0) + ' citas'"></span></div>
            <div class="bars">
              <template x-for="(s, i) in d.semana" :key="s.fecha">
                <div class="b" :class="{ today: i === 6 }" :style="'--i:' + i"><em x-text="s.citas"></em><i :style="'height:' + Math.max(8, s.citas / maxSemana * 100) + '%'"></i><span x-text="fmt.DIAS[fmt.parse(s.fecha).getDay()].slice(0, 3)"></span></div>
              </template>
            </div>
          </div>
        </div>

        <div class="stack">
          <template x-if="pendientesInicio.length">
            <div class="card">
              <div class="card-head"><h3>Primeros pasos</h3><span class="badge brand plain" x-text="(d.inicio.length - pendientesInicio.length) + '/' + d.inicio.length"></span></div>
              <div class="todo">
                <template x-for="t in d.inicio" :key="t.id"><a :href="'#/' + t.ruta" :class="{ done: t.hecho }"><span class="dot"><svg class="i" x-show="t.hecho"><use href="#i-check"/></svg></span><span x-text="t.texto"></span></a></template>
              </div>
            </div>
          </template>
          <div class="card deep" style="position:relative;overflow:hidden">
            <svg class="spark" style="position:absolute;right:22px;top:20px;width:16px" viewBox="0 0 24 24" fill="#b39ddb"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></svg>
            <div class="card-head"><h3>Progreso del día</h3></div>
            <div class="ringbox">
              <div class="ring" :style="'--len:' + circ + ';--off:' + (circ * (1 - progreso))">
                <svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" style="stroke:rgba(255,255,255,.16)"/><circle class="fg" cx="48" cy="48" r="40" style="stroke:#fff"/></svg>
                <b class="num"><span x-text="Math.round(progreso * 100)"></span>%</b>
              </div>
              <div><div style="font-weight:800" x-text="d.stats.completadas_hoy + ' de ' + d.stats.citas_hoy + ' citas atendidas'"></div>
                <p style="font-size:13.5px;margin-top:4px;color:#e1d5e7" x-text="progreso >= 1 && d.stats.citas_hoy ? '¡Día completado!' : 'Registra la consulta al terminar cada cita.'"></p></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3>Actividad reciente</h3></div>
            <p class="muted" x-show="!d.actividad.length">Aquí verás lo que ocurre en tu consultorio.</p>
            <ul class="feed">
              <template x-for="(a, i) in d.actividad" :key="i"><li><div><b x-text="a.titulo" style="font-weight:700"></b><small x-text="a.usuario + ' · ' + fmt.ago(a.fecha)"></small></div></li></template>
            </ul>
          </div>
          <div class="card" x-show="$store.app.is('administrador')">
            <div class="card-head"><h3>Copia de seguridad</h3><a class="btn sm ghost" href="#/copias">Gestionar</a></div>
            <div class="big-status"><span class="dot-live" :style="d.ultimaCopia ? '--pc:var(--ok)' : '--pc:var(--warn)'"></span>
              <div><b x-text="d.ultimaCopia || 'Sin copias todavía'"></b><div class="muted" style="font-size:13px" x-text="d.ultimaCopia ? 'Última copia exitosa' : 'Crea la primera desde Copias'"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
