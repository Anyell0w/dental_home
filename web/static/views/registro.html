<div class="auth" x-data="registroView">
  <div class="auth-form">
    <form class="inner in1" @submit.prevent="submit">
      <a class="marca" href="#/" style="padding:0"><span class="logo"></span><span class="word">DENTAL HOME</span></a>
      <div><h1>Crea tu consultorio</h1><p class="muted" style="margin-top:8px">14 días gratis. Sin tarjeta.</p></div>
      <div class="field"><label for="cl">Nombre del consultorio</label><input id="cl" class="input" x-model="f.clinica" placeholder="Sonrisa Andina" required maxlength="80"></div>
      <div class="field"><label for="em">Correo</label><input id="em" type="email" class="input" x-model="f.correo" placeholder="tu@correo.com" autocomplete="email" required></div>
      <div class="grid-2">
        <div class="field"><label for="us">Tu usuario</label><input id="us" class="input" x-model="f.usuario" autocomplete="username" autocapitalize="off" pattern="[a-z0-9._\-]{3,32}" title="3 a 32 caracteres: minúsculas, números, punto, guion o guion bajo" required></div>
        <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" class="input" x-model="f.password" minlength="8" autocomplete="new-password" required><span class="hint">Letras y números, 8 o más</span></div>
      </div>
      <div class="field"><label for="pl">Plan para la prueba</label>
        <select id="pl" class="input" x-model="f.plan"><template x-for="p in planes" :key="p.codigo"><option :value="p.codigo" :selected="p.codigo === f.plan" x-text="p.nombre + ' — ' + fmt.soles(p.precio) + ' / mes'"></option></template></select></div>
      <label class="check"><input type="checkbox" x-model="f.atiende"><span>También atiendo pacientes (soy odontólogo)</span></label>
      <div class="field" x-show="f.atiende"><label for="cop">Número de colegiatura (COP)</label><input id="cop" class="input" x-model="f.colegiatura" placeholder="COP-12345" maxlength="20" :required="f.atiende"></div>
      <label class="check"><input type="checkbox" x-model="f.demo"><span>Cargar datos de ejemplo para explorar</span></label>
      <div class="error-text" x-show="error" x-text="error"></div>
      <button class="btn primary lg" :class="{ 'is-busy': busy }" style="width:100%">Crear mi consultorio <svg class="i arr"><use href="#i-arrow"/></svg></button>
      <p class="muted" style="text-align:center">¿Ya tienes cuenta? <a class="link" href="#/login">Entrar</a></p>
    </form>
  </div>
  <div class="auth-art">
    <svg class="spark" style="width:22px;top:18%;left:16%" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></svg>
    <svg class="spark" style="width:14px;bottom:22%;right:18%;animation-delay:-1.2s" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></svg>
    <div><div class="emblem float1"></div>
      <blockquote>Tu consultorio queda listo en menos de un minuto, aislado y seguro en la nube.<small>Agenda · historia clínica · odontograma · recetas</small></blockquote></div>
  </div>

</div>
