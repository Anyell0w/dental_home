<div x-data="copiasView">
  <div class="page-head"><div><div class="kicker">Respaldo</div><h1 style="margin-top:8px">Copias de seguridad</h1><p>Exporta todos los datos de tu consultorio en un archivo descargable.</p></div>
    <button class="btn primary" x-show="permitido" :class="{ 'is-busy': busy }" @click="crear()"><svg class="i"><use href="#i-database"/></svg>Crear copia ahora</button></div>
  <template x-if="!permitido">
    <div class="card deep" style="margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span class="tile" style="background:#fff;color:#4a2e80"><svg class="i"><use href="#i-lock"/></svg></span>
      <div style="flex:1;min-width:220px"><b>Disponible desde el plan Profesional</b><div style="color:#e1d5e7;font-size:14px">Incluye copias manuales y una copia automática diaria.</div></div>
      <a class="btn" style="background:#fff;color:#4a2e80;box-shadow:none" href="#/suscripcion">Ver planes</a></div>
  </template>
  <div class="card" style="margin-bottom:16px">
    <div class="big-status"><span class="dot-live" :style="ultima ? '--pc:var(--ok)' : '--pc:var(--warn)'"></span>
      <div><h3 x-text="ultima ? 'Tus datos están respaldados' : 'Aún no tienes copias'"></h3><p class="muted" style="margin-top:2px" x-text="ultima ? 'Última copia exitosa: ' + ultima.fin : 'Crea tu primera copia para estar tranquilo.'"></p></div></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Bitácora</h3></div>
    <p class="muted" x-show="!lista.length">Sin copias registradas.</p>
    <div class="stagger"><template x-for="(c, i) in lista" :key="c.id">
      <div class="file-row" :style="'--i:' + Math.min(i, 10)"><span class="tile" :class="c.tipo === 'automatica' ? 'outline' : ''"><svg class="i"><use href="#i-database"/></svg></span>
        <div class="grow"><b x-text="c.inicio"></b><div class="muted" style="font-size:13px" x-text="(c.tipo === 'automatica' ? 'Automática' : 'Manual · ' + c.usuario)"></div></div>
        <span class="badge" :class="{ ok: c.estado === 'exitoso', bad: c.estado === 'fallido', warn: c.estado === 'pendiente' }" x-text="fmt.cap(c.estado)"></span>
        <a class="btn sm" x-show="c.disponible" :href="'/api/copias/' + c.id + '/descargar'"><svg class="i"><use href="#i-download"/></svg>Descargar</a></div>
    </template></div>
  </div>
</div>
