<div x-data="equipoView">
  <div class="page-head"><div><div class="kicker">Accesos</div><h1 style="margin-top:8px">Equipo y roles</h1><p><span class="num" x-text="$store.app.uso.usuarios"></span> de <span x-text="$store.app.sub.plan?.max_usuarios || '∞'"></span> usuarios activos</p></div>
    <button class="btn primary" @click="nuevo()"><svg class="i"><use href="#i-userplus"/></svg>Agregar miembro</button></div>
  <div class="card soft" style="margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <span class="tile deep"><svg class="i"><use href="#i-key"/></svg></span>
    <div style="flex:1;min-width:200px"><b>Código de tu clínica</b><div class="muted" style="font-size:13.5px">Tu equipo lo usa junto a su usuario o correo para iniciar sesión.</div></div>
    <code class="badge deep plain" style="font-size:14px;height:34px;padding:0 16px" x-text="$store.app.clinica.codigo"></code>
    <button class="btn sm" @click="copiar()">Copiar</button>
  </div>
  <div class="team-grid stagger">
    <template x-for="(u, i) in lista" :key="u.id">
      <div class="card member" :class="{ off: !u.activo }" :style="'--i:' + Math.min(i, 12)">
        <div class="avatar" x-text="fmt.initials(u.usuario)"></div>
        <div class="info"><strong x-text="u.usuario"></strong>
          <span class="muted" style="font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis" x-text="u.correo"></span>
          <span class="muted" style="font-size:12.5px" x-text="u.esDoctor ? u.colegiatura + ' · ' + fmt.turno(u.turno) : (u.rol === 'administrador' ? 'Acceso total' : 'Pacientes y agenda')"></span></div>
        <div style="display:grid;gap:6px;justify-items:end">
          <span class="badge" :class="{ deep: u.rol === 'administrador', brand: u.rol === 'doctor' }" x-text="fmt.rol(u.rol)"></span>
          <span class="badge bad" x-show="u.bloqueado">Bloqueado</span>
        </div>
        <div style="display:flex">
          <button class="btn ghost icon sm" title="Desbloquear" x-show="u.bloqueado" @click="desbloquear(u)"><svg class="i"><use href="#i-unlock"/></svg></button>
          <button class="btn ghost icon sm" title="Editar" @click="editar(u)"><svg class="i"><use href="#i-edit"/></svg></button>
          <button class="btn ghost icon sm" title="Restablecer contraseña" @click="clave = { u, nueva: '' }"><svg class="i"><use href="#i-key"/></svg></button>
          <button class="btn ghost icon sm" :class="u.activo ? 'danger' : ''" :title="u.activo ? 'Desactivar' : 'Reactivar'" x-show="u.id !== $store.app.user.id" @click="alternar(u)"><svg class="i"><use :href="u.activo ? '#i-lock' : '#i-check'"/></svg></button>
        </div>
      </div>
    </template>
  </div>

  <template x-if="form">
    <div class="overlay" @click.self="form = null" @keydown.escape.window="form = null">
      <form class="modal" @submit.prevent="guardar">
        <div class="kicker" x-text="form.id ? 'Editar' : 'Nuevo miembro'"></div><h2 style="margin-top:6px" x-text="form.id ? form.usuario : 'Agregar miembro'"></h2><p class="sub">Cada persona entra con su propio usuario.</p>
        <div class="form">
          <div class="field"><label>Rol</label><div class="seg" style="display:flex"><template x-for="r in ['doctor','secretaria','administrador']" :key="r"><button type="button" style="flex:1" :class="{ on: form.rol === r }" @click="form.rol = r" x-text="fmt.rol(r)" :disabled="form.id === $store.app.user.id && r !== form.rol"></button></template></div></div>
          <template x-if="!form.id"><div class="grid-2"><div class="field"><label>Usuario</label><input class="input" x-model="form.usuario" autocapitalize="off" required pattern="[a-z0-9._\-]{3,32}" title="3 a 32 caracteres: minúsculas, números, punto, guion o guion bajo" placeholder="dra.quispe" x-init="$nextTick(() => $el.focus())"></div>
            <div class="field"><label>Contraseña inicial</label><input type="password" class="input" x-model="form.password" minlength="8" required autocomplete="new-password"></div></div></template>
          <div class="field"><label>Correo</label><input type="email" class="input" x-model="form.correo" required maxlength="120"><span class="hint">Se usa para iniciar sesión y recuperar la contraseña.</span></div>
          <label class="check" x-show="form.rol === 'administrador'"><input type="checkbox" x-model="form.atiende"><span>También atiende pacientes (perfil de doctor)</span></label>
          <div class="grid-2" x-show="pideColegiatura">
            <div class="field"><label>Colegiatura (COP)</label><input class="input" x-model="form.colegiatura" maxlength="20" placeholder="COP-12345" :required="pideColegiatura"></div>
            <div class="field"><label>Turno</label><select class="input" x-model="form.turno"><option value="manana">Mañana</option><option value="tarde">Tarde</option><option value="tiempo_completo">Tiempo completo</option></select></div>
          </div>
          <div class="error-text" x-show="error" x-text="error"></div>
          <div class="actions"><button type="button" class="btn" @click="form = null">Cancelar</button><button class="btn primary" :class="{ 'is-busy': busy }" x-text="form.id ? 'Guardar' : 'Agregar'"></button></div>
        </div>
      </form>
    </div>
  </template>

  <template x-if="clave">
    <div class="overlay" @click.self="clave = null" @keydown.escape.window="clave = null">
      <form class="modal" style="width:min(440px,100%)" @submit.prevent="resetear">
        <div class="kicker">Contraseña</div><h2 style="margin-top:6px">Nueva contraseña</h2><p class="sub" x-text="'Para ' + clave.u.usuario + '. Se cerrarán sus sesiones abiertas.'"></p>
        <div class="form"><div class="field"><label>Contraseña</label><input type="password" class="input" x-model="clave.nueva" minlength="8" required autocomplete="new-password" x-init="$nextTick(() => $el.focus())"><span class="hint">Mínimo 8 caracteres, con letras y números.</span></div>
          <div class="error-text" x-show="error" x-text="error"></div>
          <div class="actions"><button type="button" class="btn" @click="clave = null">Cancelar</button><button class="btn primary" :class="{ 'is-busy': busy }">Guardar</button></div></div>
      </form>
    </div>
  </template>
</div>
