<div class="auth" x-data="restablecerView">
  <div class="auth-form">
    <form class="inner in1" @submit.prevent="submit">
      <a class="marca" href="#/" style="padding:0"><span class="logo"></span><span class="word">DENTAL HOME</span></a>
      <div><h1>Nueva contraseña</h1><p class="muted" style="margin-top:8px">Al guardarla se cerrarán tus sesiones abiertas.</p></div>
      <template x-if="!listo"><div class="form">
        <div class="field"><label for="p1">Contraseña</label><input id="p1" type="password" class="input" x-model="f.password" minlength="8" autocomplete="new-password" required><span class="hint">Mínimo 8 caracteres, con letras y números.</span></div>
        <div class="field"><label for="p2">Repite la contraseña</label><input id="p2" type="password" class="input" x-model="f.repetir" minlength="8" autocomplete="new-password" required></div>
        <div class="error-text" x-show="error" x-text="error"></div>
        <button class="btn primary lg" :class="{ 'is-busy': busy }" style="width:100%">Guardar contraseña</button>
      </div></template>
      <template x-if="listo"><div class="form"><div class="ok-text">Listo. Ya puedes entrar con tu nueva contraseña.</div><a class="btn primary lg" href="#/login">Iniciar sesión</a></div></template>
    </form>
  </div>
  <div class="auth-art">
    <svg class="spark" style="width:22px;top:18%;left:16%" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></svg>
    <svg class="spark" style="width:14px;bottom:22%;right:18%;animation-delay:-1.2s" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></svg>
    <div><div class="emblem float1"></div>
      <blockquote>Un paso más y vuelves a tu consultorio.<small>Dental Home</small></blockquote></div>
  </div>

</div>
