<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dental Home — Software para consultorios dentales</title>
  <meta name="description" content="Agenda, historia clínica, odontograma y recetas en un solo lugar. Software en la nube para consultorios dentales pequeños y medianos, con precios en soles.">
  <meta name="theme-color" content="#4a2e80">
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="preload" href="/static/vendor/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/vendor/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/landing.css">
  <script defer src="/static/js/core.js"></script>
  <script defer src="/static/js/shell.js"></script>
  <script defer src="/static/js/views.js"></script>
  <script defer src="/static/js/odontograma.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
<!-- Sprite de iconos (trazo lineal 1.9, como el landing) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="grad-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a2e80"/><stop offset="1" stop-color="#b39ddb"/></linearGradient>
  </defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3.5l9 7V20a1 1 0 0 1-1 1h-5v-6.5H9V21H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.9-3.4 3.4-5.5 6.5-5.5s5.6 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.5.8 2.6 2.6 3 5.2"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5Z"/><path d="M14 3v5.5h5.5M12 11.5v5M9.5 14h5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.2 7.5 9.5 4.4-1.3 7.5-4.9 7.5-9.5V6Z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.9-3.4 3.4-5.5 6.5-5.5s5.6 2.1 6.5 5.5"/><path d="M16.5 8.5 18 10l3-3"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19M6.5 15h3"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pill" viewBox="0 0 24 24"><path d="m10.5 20.5 10-10a4.95 4.95 0 0 0-7-7l-10 10a4.95 4.95 0 0 0 7 7z"/><path d="m8.5 8.5 7 7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 7.7-1.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
  <symbol id="i-userplus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.9-3.4 3.4-5.5 6.5-5.5s5.6 2.1 6.5 5.5M19 8v6M22 11h-6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 7.4 10 10-7.6 2.6-9.4 5.4-10 10-.6-4.6-2.4-7.4-10-10 7.6-2.6 9.4-5.4 10-10Z"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12Z"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M3 21h18M8 7h4M8 11h4M8 15h4"/></symbol>
  <symbol id="i-tooth" viewBox="0 0 24 24"><path d="M7.5 3.5c-2.5 0-4 2-4 4.6 0 3 1.3 4.3 1.8 7.4.4 2.6.9 5 2.3 5 1.6 0 1.5-4.6 2.6-6 .6-.8 1.6-.8 2.2 0 1.1 1.4 1 6 2.6 6 1.4 0 1.9-2.4 2.3-5 .5-3.1 1.8-4.4 1.8-7.4 0-2.6-1.5-4.6-4-4.6-1.8 0-2.6 1-3.5 1s-1.7-1-3.5-1Z"/></symbol>
</svg>

<div id="root" x-data x-cloak>
  <!-- Páginas públicas (landing, login, registro, recuperación, pago, consola) -->
  <template x-if="$store.app.ready && $store.router.pub">
    <div class="view" x-html="$store.router.html"></div>
  </template>

  <!-- Aplicación -->
  <template x-if="$store.app.ready && !$store.router.pub && $store.app.user">
    <div class="shell" x-data="shell">
      <aside class="side">
        <a class="marca" href="#/inicio"><span class="logo" role="img" aria-label="Dental Home"></span><span class="word">DENTAL HOME</span></a>
        <nav class="nav">
          <template x-for="n in nav" :key="n.r">
            <a :href="'#/' + n.r" :class="{ on: $store.router.name === n.r }"><svg class="i"><use :href="'#i-' + n.i"/></svg><span x-text="n.t"></span></a>
          </template>
        </nav>
        <div class="side-foot">
          <div class="usage" x-show="$store.app.is('administrador') && $store.app.sub.plan">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b x-text="'Plan ' + $store.app.sub.plan?.nombre"></b>
              <span style="font-size:12px;font-weight:800;white-space:nowrap" :style="'color:' + ($store.app.sub.estado === 'prueba' ? 'var(--brand)' : ($store.app.sub.vigente ? 'var(--ok)' : 'var(--bad)'))" x-text="fmt.estadoSub($store.app.sub)"></span></div>
            <template x-if="$store.app.sub.plan?.max_pacientes">
              <div><div class="muted" style="font-size:12px;margin-bottom:5px;font-weight:600" x-text="$store.app.uso.pacientes + ' / ' + $store.app.sub.plan.max_pacientes + ' pacientes'"></div>
                <div class="meter" :class="{ hot: pct('pacientes') > 85 }"><i :style="'--w:' + pct('pacientes') + '%'"></i></div></div>
            </template>
          </div>
          <div style="display:flex;align-items:center;gap:10px;padding:6px 8px">
            <div class="avatar sm" x-text="fmt.initials($store.app.user.usuario)"></div>
            <div style="min-width:0;flex:1"><div style="font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis" x-text="$store.app.user.usuario"></div>
              <div class="muted" style="font-size:12px;font-weight:600" x-text="fmt.rol($store.app.user.rol)"></div></div>
            <button class="btn ghost icon sm" title="Cambiar contraseña" @click="$store.ui.clave = { actual: '', nueva: '' }"><svg class="i"><use href="#i-key"/></svg></button>
            <button class="btn ghost icon sm" title="Cerrar sesión" @click="$store.app.logout()"><svg class="i"><use href="#i-logout"/></svg></button>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="top">
          <button class="search" @click="$store.ui.cmdk = true">
            <svg class="i"><use href="#i-search"/></svg><span>Buscar pacientes o ir a…</span><span class="kbd" style="flex:none">Ctrl K</span>
          </button>
          <div class="spacer"></div>
          <span class="muted hide-m" style="font-size:13.5px;font-weight:700" x-text="$store.app.clinica.nombre"></span>
          <button class="btn ghost icon" title="Cambiar tema" @click="$store.app.toggleTheme()"><svg class="i"><use :href="$store.app.theme === 'dark' ? '#i-sun' : '#i-moon'"/></svg></button>
          <button class="btn ghost icon hide-d" title="Cerrar sesión" @click="$store.app.logout()"><svg class="i"><use href="#i-logout"/></svg></button>
        </header>

        <template x-if="$store.app.sub.estado === 'prueba'">
          <div class="banner"><span class="dot-live"></span>
            <span x-text="'Prueba gratuita: te quedan ' + $store.app.sub.dias_restantes + ' días con el plan ' + $store.app.sub.plan.nombre + '.'"></span>
            <a x-show="$store.app.is('administrador')" href="#/suscripcion">Elegir plan</a></div>
        </template>
        <template x-if="!$store.app.sub.vigente">
          <div class="banner bad"><svg class="i"><use href="#i-alert"/></svg>
            <span>Tu suscripción no está activa. Puedes consultar tu información, pero no registrar cambios.</span>
            <a x-show="$store.app.is('administrador')" href="#/suscripcion">Renovar</a></div>
        </template>

        <main class="page view" x-html="$store.router.html"></main>
      </div>

      <nav class="tabbar">
        <template x-for="n in nav.slice(0, 5)" :key="n.r">
          <a :href="'#/' + n.r" :class="{ on: $store.router.name === n.r }"><svg class="i"><use :href="'#i-' + n.i"/></svg><span x-text="n.t"></span></a>
        </template>
      </nav>
    </div>
  </template>

  <!-- Paleta de comandos -->
  <template x-if="$store.ui.cmdk">
    <div class="overlay" @click.self="$store.ui.cmdk = false" x-data="cmdk" @keydown.escape.window="$store.ui.cmdk = false">
      <div class="cmdk" @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)" @keydown.enter.prevent="go()">
        <input x-ref="q" x-model="q" @input.debounce.180ms="search()" placeholder="Busca un paciente o escribe una sección…" x-init="$nextTick(() => $refs.q.focus())">
        <ul>
          <template x-for="(it, idx) in items" :key="it.k">
            <li :class="{ on: idx === sel, grp: it.grp }" @mouseenter="!it.grp && (sel = idx)" @click="!it.grp && go(idx)">
              <template x-if="it.grp"><span x-text="it.t"></span></template>
              <template x-if="!it.grp"><span style="display:contents"><svg class="i"><use :href="'#i-' + it.i"/></svg><span x-text="it.t"></span><small x-text="it.s"></small></span></template>
            </li>
          </template>
          <li x-show="!items.length" class="muted" style="cursor:default">Sin resultados</li>
        </ul>
      </div>
    </div>
  </template>

  <!-- Cambiar mi contraseña -->
  <template x-if="$store.ui.clave">
    <div class="overlay" @click.self="$store.ui.clave = null" @keydown.escape.window="$store.ui.clave = null" x-data="miClave">
      <form class="modal" style="width:min(440px,100%)" @submit.prevent="guardar">
        <h2>Cambiar mi contraseña</h2><p class="sub">Se cerrarán tus otras sesiones abiertas.</p>
        <div class="form">
          <div class="field"><label>Contraseña actual</label><input type="password" class="input" x-model="$store.ui.clave.actual" required autocomplete="current-password" x-init="$nextTick(() => $el.focus())"></div>
          <div class="field"><label>Nueva contraseña</label><input type="password" class="input" x-model="$store.ui.clave.nueva" required minlength="8" autocomplete="new-password"><span class="hint">Mínimo 8 caracteres, con letras y números.</span></div>
          <div class="error-text" x-show="error" x-text="error"></div>
          <div class="actions"><button type="button" class="btn" @click="$store.ui.clave = null">Cancelar</button><button class="btn primary" :class="{ 'is-busy': busy }">Guardar</button></div>
        </div>
      </form>
    </div>
  </template>

  <!-- Confirmación -->
  <template x-if="$store.ui.dialog">
    <div class="overlay" @keydown.escape.window="$store.ui.answer(false)" @click.self="$store.ui.answer(false)">
      <div class="modal" style="width:min(440px,100%)" role="alertdialog">
        <h2 x-text="$store.ui.dialog.title"></h2>
        <p class="sub" x-text="$store.ui.dialog.text" style="margin-bottom:22px"></p>
        <div class="actions">
          <button class="btn" @click="$store.ui.answer(false)">Cancelar</button>
          <button class="btn" :class="$store.ui.dialog.danger ? 'danger-fill' : 'primary'" @click="$store.ui.answer(true)" x-text="$store.ui.dialog.ok || 'Confirmar'"></button>
        </div>
      </div>
    </div>
  </template>

  <div class="toasts" aria-live="polite">
    <template x-for="t in $store.ui.toasts" :key="t.id">
      <div class="toast" :class="t.type"><svg class="i"><use :href="t.type === 'error' ? '#i-alert' : '#i-check'"/></svg><span x-text="t.msg"></span></div>
    </template>
  </div>
</div>
<noscript><p style="padding:40px;text-align:center">Dental Home necesita JavaScript para funcionar.</p></noscript>
</body>
</html>
